# WordPress redirects - processed at Netlify edge before Next.js routes
# WordPress category redirects (specific first)
[[redirects]]
  from = "/category/insights"
  to = "/insights"
  status = 301

[[redirects]]
  from = "/category/insights/page/*"
  to = "/insights"
  status = 301

[[redirects]]
  from = "/category/*"
  to = "/insights"
  status = 301

# WordPress author redirects
[[redirects]]
  from = "/author/*"
  to = "/insights"
  status = 301

# WordPress tag redirects
[[redirects]]
  from = "/tag/*"
  to = "/insights"
  status = 301

# Custom taxonomy redirects
[[redirects]]
  from = "/stm_service_category/*"
  to = "/insights"
  status = 301

# WordPress date archives - specific years (2018-2024) to avoid regex conflicts
# Year-only redirects
